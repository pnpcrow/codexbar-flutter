name: codexbar
description: "Every AI coding limit, in your system tray. Linux port of CodexBar."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # System tray & window management
  tray_manager: ^0.5.3
  window_manager: ^0.5.0

  # Persistence
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # HTTP & networking
  http: ^1.4.0
  cookie_jar: ^4.0.8
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.2.0

  # Utilities
  intl: ^0.20.0
  collection: ^1.19.0
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  freezed: ^2.5.8
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
