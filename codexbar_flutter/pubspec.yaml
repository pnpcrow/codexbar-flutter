name: codexbar_flutter
description: "CodexBar - AI Provider Usage Monitor"
publish_to: 'none'
version: 0.43.1+105

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP
  http: ^1.4.0

  # Storage
  shared_preferences: ^2.5.3

  # System tray
  system_tray: ^2.0.3

  # Window management
  window_manager: ^0.5.0

  # Notifications
  flutter_local_notifications: ^19.2.1

  # Charts
  fl_chart: ^0.71.0

  # Path
  path_provider: ^2.1.5
  path: ^1.9.1

  # Process
  process_run: ^0.14.2

  # Logging
  logging: ^1.3.0

  # Date/Time
  intl: ^0.20.2

  # UUID
  uuid: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
